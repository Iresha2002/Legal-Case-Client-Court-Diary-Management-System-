name: legal-diary

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${COMPOSE_DB_NAME:-legal_diary}
      POSTGRES_USER: diary_admin
      POSTGRES_PASSWORD: ${COMPOSE_DB_ADMIN_PASSWORD:?Set COMPOSE_DB_ADMIN_PASSWORD in .env}
      APP_DB_PASSWORD: ${COMPOSE_DB_PASSWORD:?Set COMPOSE_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
      - ./docker/postgres/02-app-permissions.sql:/docker-entrypoint-initdb.d/02-app-permissions.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${COMPOSE_DB_NAME:-legal_diary}
      DB_USERNAME: diary_app
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:?Set COMPOSE_DB_PASSWORD in .env}
      DB_MIGRATION_USERNAME: diary_admin
      DB_MIGRATION_PASSWORD: ${COMPOSE_DB_ADMIN_PASSWORD:?Set COMPOSE_DB_ADMIN_PASSWORD in .env}
    ports:
      - '127.0.0.1:${COMPOSE_BACKEND_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, '--spider', 'http://127.0.0.1:8080/login']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - '127.0.0.1:${COMPOSE_FRONTEND_PORT:-5173}:5173'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
