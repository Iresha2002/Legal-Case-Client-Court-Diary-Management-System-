spring.application.name=diary-backend
server.port=8080

spring.config.import=optional:classpath:application-local.properties

# PostgreSQL credentials are supplied through environment variables or the local file.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL is the application database.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.user=${DB_MIGRATION_USERNAME:${DB_USERNAME}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}

# JWT configuration (secret must be supplied via environment or application-local.properties)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000
