spring.application.name=diary-backend
server.port=8080

spring.config.import=optional:classpath:application-local.properties

# Database configuration. Without DB_URL the app uses an in-memory H2 database,
# so no PostgreSQL is needed until the database is connected.
spring.datasource.url=${DB_URL:jdbc:h2:mem:legaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=false

# JWT configuration (secret must be supplied via environment or application-local.properties)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000
